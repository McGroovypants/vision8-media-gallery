<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vision8 Media Photo Gallery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#1a1a1a;color:#f0f0f0;min-height:100vh}

/* Login screen */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-screen h1{font-size:1.8rem;margin-bottom:1.5rem;text-align:center}
.login-box{background:#2a2a2a;border-radius:12px;padding:2rem;max-width:400px;width:100%;text-align:center}
.login-box input{width:100%;padding:12px;border:1px solid #444;border-radius:8px;background:#333;color:#fff;font-size:1rem;margin-bottom:1rem}
.login-box input:focus{outline:none;border-color:#4ade80}
.login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:#4ade80;color:#1a1a1a;font-size:1rem;font-weight:600;cursor:pointer}
.login-box button:hover{background:#22c55e}
.login-error{color:#f87171;font-size:0.9rem;margin-top:0.5rem;display:none}

/* Gallery */
.gallery-container{display:none;max-width:1400px;margin:0 auto;padding:2rem 2.5rem}
.gallery-header{text-align:center;padding:1.5rem 0 1rem}
.gallery-header h1{font-size:1.6rem;font-weight:600;letter-spacing:-0.02em}
.logos{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.logo{height:50px;max-width:180px;object-fit:contain}
.logo-divider{width:1px;height:40px;background:#444}

/* Tabs */
.tab-bar{display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center;margin:1.5rem 0 2rem}
.tab-btn{padding:10px 28px;border:1px solid #444;border-radius:24px;background:transparent;color:#aaa;cursor:pointer;font-size:0.95rem;font-weight:500;transition:all 0.2s;letter-spacing:0.01em}
.tab-btn:hover{border-color:#4ade80;color:#fff}
.tab-btn.active{background:#4ade80;color:#1a1a1a;border-color:#4ade80;font-weight:600}

/* Grid — 5 columns, generous gaps */
.thumb-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.thumb{border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;position:relative;background:#222}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s ease,opacity 0.3s ease;opacity:0}
.thumb img.loaded{opacity:1}
.thumb:hover img{transform:scale(1.04)}

/* Video badge */
.video-thumb .play-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;background:rgba(0,0,0,0.55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;pointer-events:none;transition:all 0.25s;backdrop-filter:blur(4px)}
.video-thumb:hover .play-badge{background:rgba(74,222,128,0.85);transform:translate(-50%,-50%) scale(1.08)}

/* Video info bar */
.video-info{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,0.75));display:flex;justify-content:space-between;align-items:flex-end}
.video-title{font-size:0.8rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;margin-right:10px;font-weight:500}
.video-duration{font-size:0.75rem;color:#ccc;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Download */
.download-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;background:#4ade80;color:#1a1a1a;text-decoration:none;border-radius:8px;font-weight:600;margin:0 0 1.5rem;font-size:0.95rem;transition:background 0.2s}
.download-btn:hover{background:#22c55e}

/* Image Lightbox */
.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:1000;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px)}
.lightbox.active{display:flex}
.lightbox img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,0.5)}

/* Video Lightbox (legacy Cloudinary) */
.video-lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.video-lightbox.active{display:flex}
.video-lightbox-inner{position:relative;max-width:95vw;max-height:95vh;width:900px}
.video-lightbox video{width:100%;max-height:85vh;border-radius:6px;background:#000}
.video-close{position:absolute;top:-44px;right:0;color:#fff;font-size:1.5rem;cursor:pointer;background:rgba(255,255,255,0.1);border:none;padding:8px 12px;border-radius:8px;opacity:0.7;transition:opacity 0.2s}
.video-close:hover{opacity:1;background:rgba(255,255,255,0.2)}

/* Vimeo Lightbox */
.vimeo-lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.vimeo-lightbox.active{display:flex}
.vimeo-lightbox-inner{position:relative;width:90vw;max-width:1100px;aspect-ratio:16/9}
.vimeo-lightbox-inner iframe{width:100%;height:100%;border:none;border-radius:6px}
.vimeo-close{position:absolute;top:-44px;right:0;color:#fff;font-size:1.5rem;cursor:pointer;background:rgba(255,255,255,0.1);border:none;padding:8px 12px;border-radius:8px;opacity:0.7;transition:opacity 0.2s}
.vimeo-close:hover{opacity:1;background:rgba(255,255,255,0.2)}

.credit{text-align:center;padding:3rem 0 1.5rem;font-size:0.85rem;opacity:0.4;letter-spacing:0.02em}

/* Responsive */
@media(max-width:1100px){
  .thumb-grid{grid-template-columns:repeat(4,1fr);gap:14px}
}
@media(max-width:800px){
  .thumb-grid{grid-template-columns:repeat(3,1fr);gap:12px}
  .gallery-container{padding:1.5rem 1.25rem}
}
@media(max-width:550px){
  .thumb-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .tab-btn{padding:8px 18px;font-size:0.85rem}
  .logo{height:36px;max-width:120px}
  .gallery-header h1{font-size:1.2rem}
  .video-lightbox-inner,.vimeo-lightbox-inner{width:96vw}
}
</style>
</head>

<!-- Image Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt=""/>
</div>

<!-- Video Lightbox (legacy Cloudinary) -->
<div class="video-lightbox" id="videoLightbox">
  <div class="video-lightbox-inner">
    <button class="video-close" onclick="closeVideo()">&#10005;</button>
    <video id="videoPlayer" controls preload="metadata"></video>
  </div>
</div>

<!-- Vimeo Lightbox -->
<div class="vimeo-lightbox" id="vimeoLightbox">
  <div class="vimeo-lightbox-inner">
    <button class="vimeo-close" onclick="closeVimeo()">&#10005;</button>
    <iframe id="vimeoPlayer" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<script>


// Lazy image fade-in
document.querySelectorAll('.thumb img').forEach(img => {
  if (img.complete) { img.classList.add('loaded'); }
  else { img.addEventListener('load', () => img.classList.add('loaded')); }
});

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).style.display = 'grid';
  });
});

// Image Lightbox
function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.getElementById('lightboxImg').src = '';
}

// Video Lightbox (legacy Cloudinary)
function openVideo(url) {
  const player = document.getElementById('videoPlayer');
  player.src = url;
  document.getElementById('videoLightbox').classList.add('active');
  player.play();
}
function closeVideo() {
  const player = document.getElementById('videoPlayer');
  player.pause();
  player.src = '';
  document.getElementById('videoLightbox').classList.remove('active');
}

// Vimeo Lightbox
function openVimeo(url) {
  document.getElementById('vimeoPlayer').src = url;
  document.getElementById('vimeoLightbox').classList.add('active');
}
function closeVimeo() {
  document.getElementById('vimeoPlayer').src = '';
  document.getElementById('vimeoLightbox').classList.remove('active');
}

// Close lightboxes on background click
document.getElementById('videoLightbox').addEventListener('click', function(e) {
  if (e.target === this) closeVideo();
});
document.getElementById('vimeoLightbox').addEventListener('click', function(e) {
  if (e.target === this) closeVimeo();
});

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeLightbox();
    closeVideo();
    closeVimeo();
  }
});
</script>
</body>
